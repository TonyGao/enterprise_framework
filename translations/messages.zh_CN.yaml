adminIndex.1: '狗狗框架'
adminIndex.2: 'v0.1.0 · 基于 Symfony 7.4 LTS 构建'
adminIndex.3: '基于 Symfony 7.4 LTS 构建的企业级低代码开发平台。提供模型驱动开发、动态表单、可视化视图设计、RESTful API 自动生成等核心能力，助力企业快速构建高质量业务系统。'
adminIndex.4: 'LTS 全栈框架'
adminIndex.5: '运行环境'
adminIndex.6: '应用服务器'
adminIndex.7: '核心功能'
adminIndex.8: '模型驱动开发'
adminIndex.9: '开发中'
adminIndex.10: '通过可视化界面定义数据模型，自动生成 Doctrine 实体、数据库表、CRUD 接口和后台管理页面，实现从模型到应用的一键生成。'
adminIndex.11: '预计 Q3 2025 完成'
adminIndex.12: '视图设计器'
adminIndex.13: '拖拽式可视化视图编辑器，支持自定义布局、组件配置、数据绑定，所见即所得地构建业务页面，无需手写前端代码。'
adminIndex.14: 'RESTful API 自动生成'
adminIndex.15: '基于模型定义自动生成标准化 RESTful API，支持 CRUD 操作、关联查询、分页过滤，零代码构建后端接口服务。'
adminIndex.16: '动态数据表格'
adminIndex.17: '配置化的数据表格组件，支持列定义、排序、筛选、分页、行内编辑、批量操作，自动适配不同数据源。'
adminIndex.18: '已就绪'
adminIndex.19: '组织架构管理'
adminIndex.20: '树形组织架构管理，支持公司、部门、岗位、职级体系，灵活的人员归属和权限分配，适配各类企业结构。'
adminIndex.21: '定时任务调度'
adminIndex.22: '内置 Cron 定时任务引擎，支持任务管理、执行日志、日历视图，满足系统自动化运维与定时业务处理需求。'
adminIndex.23: '技术优势'
adminIndex.24: 'FrankenPHP Worker 模式'
adminIndex.25: '基于 Caddy'
adminIndex.26: 'PHP 常驻内存运行，避免传统 FPM 每次请求启动的开销，请求延迟降低 80'
adminIndex.27: '，吞吐量提升 3-5 倍。'
adminIndex.28: 'Symfony 7.4 LTS 全栈'
adminIndex.29: '基于 Symfony 7.4 LTS（2025.11 - 2029.11），充分利用 Doctrine ORM、Form、Security、Messenger、Mercure 等核心组件。'
adminIndex.30: 'sunui 组件库'
adminIndex.31: '自研 UI 组件库，包含表格、表单、树、选择器、抽屉、弹窗等 30'
adminIndex.32: '组件，jQuery 驱动，轻量无框架依赖。'
adminIndex.33: '基于 Doctrine Tree 扩展实现高性能树形数据管理，支持菜单、组织架构、视图目录等场景。'
adminIndex.34: '低代码'
adminIndex.35: '可扩展'
adminIndex.36: '低代码生成与手写代码无缝融合，生成的代码均为标准 Symfony 组件，可自由修改扩展，不被框架锁定。'
adminIndex.37: 'Mercure 实时推送'
adminIndex.38: '基于 Mercure 协议的 SSE 实时通信，支持在线心跳、消息推送、数据同步，无需额外部署 WebSocket。'
adminIndex.39: '多存储后端'
adminIndex.40: '基于 Flysystem 统一文件存储抽象，支持本地、阿里云 OSS、AWS S3 等多种存储后端，配置切换无需改代码。'
adminIndex.41: '企业级安全'
adminIndex.42: '三员分立权限模型、WebAuthn 无密码认证、CSRF 防护、Session 安全管理，满足等保合规要求。'
adminIndex.43: '狗狗框架 v0.1.0 · Built with Symfony 7.4'
adminIndex.44: '文档'
adminIndex.45: '帮助'
