adminIndex.1: 'Dog Framework'
adminIndex.2: 'v0.1.0 · Built on Symfony 7.4 LTS'
adminIndex.3: 'An enterprise low-code platform built on Symfony 7.4 LTS, providing model-driven development, dynamic forms, visual view design, and auto-generated RESTful APIs to help enterprises build high-quality business systems quickly.'
adminIndex.4: 'LTS Full-Stack Framework'
adminIndex.5: 'Runtime'
adminIndex.6: 'App Server'
adminIndex.7: 'Core Features'
adminIndex.8: 'Model-Driven Development'
adminIndex.9: 'In Development'
adminIndex.10: 'Define data models visually and auto-generate Doctrine entities, DB tables, CRUD APIs and admin pages — one-click model-to-app.'
adminIndex.11: 'Expected Q3 2025'
adminIndex.12: 'View Designer'
adminIndex.13: 'Drag-and-drop visual view editor with custom layouts, component config and data binding — build business pages WYSIWYG without writing frontend code.'
adminIndex.14: 'Auto-Generated RESTful APIs'
adminIndex.15: 'Auto-generate standard RESTful APIs from model definitions with CRUD, relational queries, pagination and filtering — zero-code backend services.'
adminIndex.16: 'Dynamic Data Grids'
adminIndex.17: 'Configurable data grids with columns, sorting, filtering, pagination, inline editing and bulk actions, auto-adapting to data sources.'
adminIndex.18: 'Ready'
adminIndex.19: 'Organization Management'
adminIndex.20: 'Tree-based organization management covering companies, departments, positions and levels with flexible assignment.'
adminIndex.21: 'Scheduled Task Scheduler'
adminIndex.22: 'Built-in Cron engine with task management, execution logs and calendar view for automation and scheduled processing.'
adminIndex.23: 'Technical Advantages'
adminIndex.24: 'FrankenPHP Worker Mode'
adminIndex.25: 'Based on Caddy'
adminIndex.26: 'Persistent in-memory PHP avoids per-request FPM startup; latency reduced by 80'
adminIndex.27: '%, throughput up 3-5x.'
adminIndex.28: 'Symfony 7.4 LTS Full Stack'
adminIndex.29: 'Built on Symfony 7.4 LTS (2025.11–2029.11), leveraging Doctrine ORM, Form, Security, Messenger, Mercure and more.'
adminIndex.30: 'sunui Component Library'
adminIndex.31: 'In-house UI library with grids, forms, trees, selectors, drawers, modals and 30+'
adminIndex.32: 'components, jQuery-driven, lightweight and framework-free.'
adminIndex.33: 'High-performance tree data via Doctrine Tree for menus, organization and view directories.'
adminIndex.34: 'Low-Code'
adminIndex.35: 'Extensible'
adminIndex.36: 'Low-code generation blends with hand-written code; all output is standard Symfony components, freely extensible.'
adminIndex.37: 'Mercure Real-time Push'
adminIndex.38: 'SSE real-time via Mercure for heartbeats, push messages and data sync without WebSocket.'
adminIndex.39: 'Multiple Storage Backends'
adminIndex.40: 'Unified Flysystem storage supporting local, Aliyun OSS and AWS S3 with switchable config.'
adminIndex.41: 'Enterprise Security'
adminIndex.42: 'Three-admin separation, WebAuthn passwordless auth, CSRF protection and session security for compliance.'
adminIndex.43: 'Dog Framework v0.1.0 · Built with Symfony 7.4'
adminIndex.44: 'Docs'
