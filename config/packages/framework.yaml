# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
  secret: '%env(APP_SECRET)%'
  csrf_protection: true
  http_method_override: false
  handle_all_throwables: true
  annotations:
    enabled: false

  # Enables session support. Note that the session will ONLY be started if you read or write from it.
  # Remove or comment this section to explicitly disable session support.
  session:
    handler_id: null
    cookie_secure: auto
    cookie_samesite: lax
    cookie_httponly: true
    storage_factory_id: session.storage.factory.native

  # 全局 HTTP 客户端默认超时：避免外部调用（LLM/代理等）长时间挂起拖垮 worker 线程。
  # timeout 为含连接的总时限（LLM 网关显式指定的 60/120s 会覆盖默认值，仍受各自上限约束）。
  http_client:
    default_options:
      timeout: 30
      max_redirects: 3

  #esi: true
  #fragments: true
  php_errors:
    log: true
  assets:
    version_strategy: 'App\Asset\EfVersioningStrategy'
    packages:
      static:
        version: ~
      image:
        base_path: '/img'
        version: ~
      ui:
        base_path: 'sunui/components'
      ui-static:
        base_path: 'sunui/components'
        version: ~
      uilib:
        base_path: 'sunui/lib'
      uilib-static:
        base_path: 'sunui/lib'
        version: ~
      admin:
        base_path: 'sunui/admin'
      admin-static:
        base_path: 'sunui/admin'
        version: ~

when@test:
  framework:
    test: true
    session:
      storage_factory_id: session.storage.factory.mock_file
