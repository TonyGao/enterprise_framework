parameters:
  app.key_debug: '%env(KEY_DEBUG)%'
  page_limit: 12
  # 缓存监听器配置
  app.cache_watched_entities:
    - 'App\Entity\Organization\Position'
    - 'App\Entity\Organization\Department'
    - 'App\Entity\Organization\Company'
    # 可以继续添加其他需要监听的实体
  entity_gen_stuff:
    use_imports:
      - 'App\Entity\Traits\CommonTrait'
      - 'Doctrine\ORM\Mapping as ORM'
      - 'Symfony\Component\Uid\Uuid'
      - 'Gedmo\Mapping\Annotation as Gedmo'
    base:
      entity: 'Doctrine\ORM\Mapping\Entity'
      table: 'Doctrine\ORM\Mapping\Table'
      lifecircle: 'Doctrine\ORM\Mapping\HasLifecycleCallbacks'
      commonTrait: 'App\Entity\Traits\CommonTrait'
      generatedId: 'Doctrine\ORM\Mapping\Id'
      ID: 'Doctrine\ORM\Mapping\Column(type: "uuid", unique: true)'

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Lib'
      - '../src/Kernel.php'
      - '../src/Service/Platform/Llm/Gateway/'

  # 视图 Sub Agent 自动打标签，供编排器收集
  _instanceof:
    App\Service\AI\Orchestrator\SubAgent\ViewSubAgentInterface:
      tags: ['app.view_sub_agent']

  App\Service\AI\Orchestrator\ViewEnhanceAgentOrchestrator:
    arguments:
      $subAgents: !tagged_iterator app.view_sub_agent

  # Register Generic ModelCatalog with specific models
  Symfony\AI\Platform\Bridge\Generic\ModelCatalog:
    arguments:
      $models:
        'qwen-plus':
          class: 'Symfony\AI\Platform\Bridge\Generic\CompletionsModel'
          capabilities:
            - !php/const Symfony\AI\Platform\Capability::INPUT_TEXT
            - !php/const Symfony\AI\Platform\Capability::OUTPUT_TEXT
        'qwq-32b':
          class: 'Symfony\AI\Platform\Bridge\Generic\CompletionsModel'
          capabilities:
            - !php/const Symfony\AI\Platform\Capability::INPUT_TEXT
            - !php/const Symfony\AI\Platform\Capability::OUTPUT_TEXT
        'deepseek/deepseek-r1-0528-qwen3-8b':
          class: 'Symfony\AI\Platform\Bridge\Generic\CompletionsModel'
          capabilities:
            - !php/const Symfony\AI\Platform\Capability::INPUT_TEXT
            - !php/const Symfony\AI\Platform\Capability::OUTPUT_TEXT
        'nvidia/nemotron-3-nano':
          class: 'Symfony\AI\Platform\Bridge\Generic\CompletionsModel'
          capabilities:
            - !php/const Symfony\AI\Platform\Capability::INPUT_TEXT
            - !php/const Symfony\AI\Platform\Capability::OUTPUT_TEXT

  App\Asset\EfVersioningStrategy:
    arguments:
      - '%kernel.environment%'
      - '%env(APP_VERSION)%'
  App\Command\EfInitAdminMenuCommand:
    arguments:
      - '%app.admin_menu%'
  App\Repository\:
    resource: '../src/Repository'
    autowire: true
    tags: ['doctrine.repository_service']
  App\Twig\TwigExtension:
    tags: ['twig.extension']
  #     arguments:
  #         $sessionFactory: '@session.factory'
  App\Service\Utils\AlimtTranslationService:
    arguments:
      $alimtConfig: '%alimt%'
  App\Service\FileResolver:
    arguments:
      $projectDir: '%kernel.project_dir%'
  App\Service\Entity\EntityService:
    arguments:
      $projectDir: '%kernel.project_dir%'
  App\Doctrine\CustomNamingStrategy: '@doctrine.orm.naming_strategy.default'
  App\Service\Controller\Common: ~
  App\EventListener\Controller\AutoInjectCommonListener:
    arguments:
      $c: '@App\Service\Controller\Common'
    tags:
      - {
          name: kernel.event_listener,
          event: kernel.controller,
          method: onKernelController,
        }
  App\Service\Entity\MigrationService:
    arguments:
      $projectDir: '%kernel.project_dir%'
  App\EventSubscriber\Init\HeaderStateSubscriber:
    tags:
      - { name: kernel.event_subscriber }
  App\Service\AI\Runtime\AiContextRegistry:
    arguments:
      $contextProviders: !tagged_iterator app.ai_context

  App\Service\AI\Tool\ChromeDevToolsToolProvider: ~

  App\Service\AI\Context\ViewEditorAiContext:
    tags:
      - { name: 'app.ai_context' }

  App\Service\Platform\MenuStaticGenerator:
    arguments:
      $em: '@doctrine.orm.entity_manager'
      $twig: '@twig'
      $codeFormatterService: '@App\Service\Platform\CodeFormatterService'
      $projectDir: '%kernel.project_dir%'
  App\Service\Platform\CodeFormatterService:
    arguments:
      $formatters:
        php-cs-fixer: '%kernel.project_dir%/vendor/bin/php-cs-fixer fix'
        prettier: '%kernel.project_dir%/node_modules/.bin/prettier --write'
        twigcs: '%kernel.project_dir%/vendor/bin/twigcs'
  # 批量注册所有 Faker Provider
  App\Lib\DataFixtures\Faker\Provider\:
    resource: '../src/Lib/DataFixtures/Faker/Provider/'
    tags: ['hautelook_alice.provider']

  # 定时任务 Handler Locator（ServiceLocator 模式）
  App\Service\Task\TaskHandlerLocator:
    arguments:
      $locator: !tagged_locator { tag: 'app.task_handler', index_by: 'key' }

  App\Task\ActivateAccountByHireDateTask:
    tags:
      - {
          name: 'app.task_handler',
          key: 'App\Task\ActivateAccountByHireDateTask',
        }

  App\Service\Platform\ParameterService:
    arguments:
      $parameterBag: '@parameter_bag'
  # Profiler插件 资源重复 collector
  App\DataCollector\AssetDuplicationCollector:
    tags:
      - {
          name: 'data_collector',
          template: 'data_collector/asset_duplication.html.twig',
          id: 'asset_duplication',
        }
  App\EventListener\Entity\UniversalEntityCacheListener:
    arguments:
      $watchedEntities: '%app.cache_watched_entities%'
    tags:
      - { name: doctrine.event_listener, event: postPersist }
      - { name: doctrine.event_listener, event: postUpdate }
      - { name: doctrine.event_listener, event: postRemove }
  App\Service\Platform\DataGridService:
    arguments:
      $cache: '@cache.app'
